<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<h1>My Form</h1>
<br>
<br>
<label for="img">img:</label>
<input type="file" id="img" name="img" required>
<br>
<br>    
<body>
    <form action="/submit" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required placeholder="Enter name" minlength="3" maxlength="20">
        <br>
        <br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required placeholder="Enter email" minlength="3" maxlength="20">
        <br>
        <br>    
        <label for="tel">phone:</label>
        <input type="tel" id="tel" name="phone" required placeholder="Enter phone" minlength="10" maxlength="10">
        <br>
        <br>
        <label for="gender">gender:</label>
        <input type="text" id="gender" name="gender" required placeholder="Enter gender" minlength="4" maxlength="6">
        <br>
        <br>
        <label for="Dob">Dob:</label>
        <input type="date" id="Dob" name="Dob" required placeholder="Enter Dob" minlength="10" maxlength="10">
        <br>
        <br>
        <label for="file">file:</label>
        <input type="file" id="file" name="file" required placeholder="Enter file" minlength="3" maxlength="20">
        <br>
        <br>
        <label for="address">address:</label>
        <input type="text" id="address" name="address" required placeholder="Enter address" minlength="3" maxlength="20">
        <br>
        <br>
        <label for="checkbox">checkbox:</label>
        <input type="checkbox" id="checkbox" name="checkbox" required>
        <br>  
        <br>  


        
        <button type="submit">Submit</button>
        <br>
        <br>
        <button type="reset">Reset</button>
        <br>
        <br>
        <a href="https://www.youtube.com/">youtube</a>
    </form>
    
</body>
</html>
